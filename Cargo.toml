[package]
name = "chat-usage-db"
version = "0.1.0"
edition = "2021"
description = "A production-grade SQLite database layer in Rust modeling users, conversations, messages, and token consumption."
authors = ["bighnaraj2008-ai <236182883+bighnaraj2008-ai@users.noreply.github.com>"]
license = "MIT"

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
clap = { version = "4.5.3", features = ["derive"] }